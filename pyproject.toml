[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-decodability"
version = "0.1.0.dev0"
description = "Linear-Decodability Supervision for world-action models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest"]
data = ["numpy", "av", "pillow"]
openwam = ["numpy", "av", "pillow", "deepspeed", "safetensors"]
lingbot = ["numpy", "av", "pillow", "deepspeed", "safetensors", "scipy"]
internw0 = ["numpy", "pandas", "pyarrow", "deepspeed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
